event_recorder:
  ros__parameters:
    pre_trigger_seconds: 5.0
    post_trigger_seconds: 10.0
    history_retention_seconds: 8.0
    max_event_seconds: 300.0
    output_directory: event_bags
    storage_id: mcap  # 需要 ros-humble-rosbag2-storage-mcap；也支持 sqlite3
    history_bytes: 268435456
    input_bytes: 67108864
    writer_bytes: 536870912
    context_bytes: 16777216
    queue_items: 100000
    max_pending_events: 8
    minimum_free_bytes: 1073741824
    dedup_seconds: 60.0
    trigger_cooldown_seconds: 3.0
    # 示例 topic 清单：请按实际驱动的名称、类型和 QoS 调整。
    # go2 的 /lidar_imu 来自已验证的输入 bag；其他为常见 ROS 标准 topic 示例。
    topics: [/lidar_imu, /odom, /cmd_vel, /joint_states, /tf]
    types: [sensor_msgs/msg/Imu, nav_msgs/msg/Odometry, geometry_msgs/msg/Twist, sensor_msgs/msg/JointState, tf2_msgs/msg/TFMessage]
    reliability: [best_effort, best_effort, best_effort, best_effort, best_effort]
    durability: [volatile, volatile, volatile, volatile, volatile]
    context_topics: [/tf_static]
    context_types: [tf2_msgs/msg/TFMessage]
    # trigger_list 中的名称表示机器人类型；不自动识别或连接机器人。
    trigger_list: [go2, bunker_mini, piper]
    default_trigger: go2  # 通用 std_srvs/Trigger 服务使用的默认机器人类型
    triggers:
      go2:
        topics: [/lidar_imu, /tf_static]
      bunker_mini:
        topics: [/odom, /cmd_vel, /tf_static]
      piper:
        topics: [/joint_states, /tf, /tf_static]
