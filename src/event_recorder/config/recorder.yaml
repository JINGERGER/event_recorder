event_recorder:
  ros__parameters:
    pre_trigger_seconds: 5.0
    post_trigger_seconds: 10.0
    history_retention_seconds: 8.0
    max_event_seconds: 300.0
    output_directory: event_bags
    storage_id: mcap  # 需要 ros-humble-rosbag2-storage-mcap；也支持 sqlite3
    history_bytes: 268435456
    input_bytes: 67108864
    writer_bytes: 536870912
    context_bytes: 16777216
    queue_items: 100000
    max_pending_events: 8
    minimum_free_bytes: 1073741824
    dedup_seconds: 60.0
    trigger_cooldown_seconds: 3.0
    topics: [/imu/data, /points_raw]
    types: [sensor_msgs/msg/Imu, sensor_msgs/msg/PointCloud2]
    reliability: [best_effort, best_effort]
    durability: [volatile, volatile]
    context_topics: [/tf_static]
    context_types: [tf2_msgs/msg/TFMessage]
    # 全部数据 topic 的类型在上方注册；规则只选择需要录制的 topic。
    trigger_list: [motion, perception]
    default_trigger: motion  # std_srvs/Trigger 服务使用此规则
    triggers:
      motion:
        topics: [/imu/data, /tf_static]
      perception:
        topics: [/points_raw, /tf_static]
